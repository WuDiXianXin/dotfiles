config_version = 15

[bar.default]
background_opacity = 0.0
capsule = true
capsule_foreground = "primary"
compositor_blur = false
end = [ "media", "tray", "group:g3", "group:g4", "session" ]
shadow = false
start = [ "workspaces", "group:g5", "group:g1", "group:g2" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network_tx", "network_rx" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "temp", "ram", "sysmon" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "notifications", "wallpaper", "clipboard" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "volume", "bluetooth", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g5"
    members = [ "battery", "power_profile" ]
    opacity = 1.0
    padding = 6.0

[control_center]
hidden_tabs = [ "weather" ]
sidebar = "full"
sidebar_section = "full"

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.29999999329447746
launcher_icon = "zoom-scan"
launcher_position = "start"
position = "left"
reserve_space = false
shadow = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 1200.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1360.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 1230.0

[lockscreen]
fingerprint = false
transition = [ "disc", "honeycomb", "stripes" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-2", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-2"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-2"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[notification]
background_opacity = 0.29999999329447746
position = "top_left"

[osd]
background_opacity = 0.29999999329447746

[shell]
avatar_path = "/home/xx/Pictures/Image_1788934343277_480.jpg"
clipboard_image_action_command = "satty -f -"
font_family = "Maple Mono NF CN"
lang = "zh-Hans"
popup_shadows = false
settings_window_translucent = true

    [shell.launcher]
    auto_paste = "off"
    fetch_exchange_rates = false

    [shell.panel]
    clipboard_position = "auto"
    control_center_placement = "floating"
    list_item_background = true
    polkit_position = "auto"
    session_placement = "floating"
    shadow = false
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    directory = "/home/xx/Pictures/Screenshots"
    pipe_command = "satty -f -"
    remember_last_region = true

    [shell.session]
    show_shortcuts = false

    [shell.shadow]
    alpha = 0.0

    [shell.window_switcher]
    style = "compact"

[system.monitor]
cpu_poll_seconds = 5
memory_poll_seconds = 5
net_rx_critical_threshold = 100.0
net_tx_critical_threshold = 100.0

[theme]
builtin = "Catppuccin"
mode = "dark"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "kcolorscheme", "niri", "qt", "starship" ]

[wallpaper]
directory = "~/Pictures/wallpapers"
transition = [ "disc", "honeycomb", "stripes" ]

    [wallpaper.default]
    path = "/home/xx/Pictures/wallpapers/Anime-Girl-Night-Sky.jpg"

    [wallpaper.last]
    path = "/home/xx/Pictures/wallpapers/Anime-Girl-Night-Sky.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/xx/Pictures/wallpapers/Anime-Girl-Night-Sky.jpg"

    [wallpaper.monitors.eDP-2]
    path = "/home/xx/Pictures/wallpapers/妄想天使-三小只-2.png"

[weather]
enabled = false
refresh_minutes = 60

[widget.clock]
format = "{:%x %A %H:%M}"

[widget.cpu]
visualization = "none"

[widget.network_rx]
visualization = "none"

[widget.network_tx]
visualization = "none"

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.sysmon]
stat = "swap_pct"
visualization = "none"

[widget.temp]
visualization = "none"