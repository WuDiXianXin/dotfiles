# A TOML linter such as Tombi can use this schema to validate your config.
# If you encounter any problems, please file an issue at https://github.com/yazi-rs/schemas.

#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]
keymap = [
  # =======================
  # 书签 (h-hg/yamb)
  # =======================
  { on = ["u", "a"], run = "plugin yamb -- save", desc = "书签: 添加书签" },
  { on = ["u", "A"], run = "plugin yamb -- delete_all", desc = "书签: 删除所有" },

  { on = ["u", "g"], run = "plugin yamb -- jump_by_key", desc = "书签: 跳转" },
  { on = ["u", "G"], run = "plugin yamb -- jump_by_fzf", desc = "书签: 跳转(fzf)" },

  { on = ["u", "d"], run = "plugin yamb -- delete_by_key", desc = "书签: 删除" },
  { on = ["u", "D"], run = "plugin yamb -- delete_by_fzf", desc = "书签: 删除(fzf)" },

  { on = ["u", "r"], run = "plugin yamb -- rename_by_key", desc = "书签: 重命名" },
  { on = ["u", "R"], run = "plugin yamb -- rename_by_fzf", desc = "书签: 重命名(fzf)" },


  # =======================
  # 压缩文件（KKV9/compress, night版不需要，以后删除该插件）
  # =======================
  # 7z
  { on = ["c", "a", "7"], run = "plugin compress '7z'", desc = "压缩为 7z（无密码）" },
  { on = ["c", "a", "p"], run = "plugin compress '-p 7z'", desc = "压缩为 7z（有密码）" },
  { on = ["c", "a", "h"], run = "plugin compress '-ph 7z'", desc = "压缩为 7z（密码+隐藏文件名）" },
  # tar.gz
  { on = ["c", "a", "t"], run = "plugin compress 'tar.gz'", desc = "压缩为 tar.gz" },


  # =======================
  # 磁盘挂载（yazi-rs/plugins:mount）
  # =======================
  { on = "M", run = "plugin mount", desc = "打开 mount 面板" },
  # 按键    备用键          功能
  #
  # q       Esc             关闭 mount 面板
  # k       ↑               上移
  # j       ↓               下移
  # l       → / Enter       进入挂载点，并关闭 mount 面板
  # m       -               挂载分区
  # u       -               卸载分区
  # e       -               弹出磁盘


  { on = "<Esc>", run = "escape", desc = "退出可视模式、清除选择或取消搜索" },
  { on = "<C-[>", run = "escape", desc = "退出可视模式、清除选择或取消搜索" },
  { on = "q", run = "quit", desc = "退出 yazi 进程" },
  { on = "Q", run = "quit --no-cwd-file", desc = "退出 yazi 且不输出 cwd 文件" },
  { on = "<C-c>", run = "close", desc = "关闭当前标签页；若为最后一个则退出 yazi" },
  { on = "<C-z>", run = "suspend", desc = "挂起 yazi 进程" },

  # Hop around
  { on = "k", run = "arrow prev", desc = "上一个文件" },
  { on = "j", run = "arrow next", desc = "下一个文件" },
  { on = "<Up>", run = "arrow prev", desc = "上一个文件" },
  { on = "<Down>", run = "arrow next", desc = "下一个文件" },

  { on = ["g", "g"], run = "arrow top", desc = "转到顶部" },
  { on = "G", run = "arrow bot", desc = "转到底部" },
  { on = "<Home>", run = "arrow top", desc = "转到顶部" },
  { on = "<End>", run = "arrow bot", desc = "转到底部" },

  { on = "<C-u>", run = "arrow -50%", desc = "光标向上移动半页" },
  { on = "<C-d>", run = "arrow 50%", desc = "光标向下移动半页" },
  { on = "<C-b>", run = "arrow -100%", desc = "光标向上移动一页" },
  { on = "<C-f>", run = "arrow 100%", desc = "光标向下移动一页" },

  { on = "<S-PageUp>", run = "arrow -50%", desc = "光标向上移动半页" },
  { on = "<S-PageDown>", run = "arrow 50%", desc = "光标向下移动半页" },
  { on = "<PageUp>", run = "arrow -100%", desc = "光标向上移动一页" },
  { on = "<PageDown>", run = "arrow 100%", desc = "光标向下移动一页" },

  # Navigation
  { on = "h", run = "leave", desc = "返回父目录" },
  { on = "l", run = "enter", desc = "进入子目录" },

  { on = "<Left>", run = "leave", desc = "返回父目录" },
  { on = "<Right>", run = "enter", desc = "进入子目录" },

  { on = "H", run = "back", desc = "返回上一个目录" },
  { on = "L", run = "forward", desc = "前进到下一个目录" },

  # Toggle
  { on = "<Space>", run = ["toggle", "arrow 1"], desc = "切换当前选择状态" },
  { on = "<C-a>", run = "toggle_all --state=on", desc = "选择所有文件" },
  { on = "<C-r>", run = "toggle_all", desc = "反转所有文件的选择状态" },

  # Visual mode
  { on = "v", run = "visual_mode", desc = "进入可视模式（选择模式）" },
  { on = "V", run = "visual_mode --unset", desc = "进入可视模式（取消选择模式）" },

  # Seeking
  { on = "K", run = "seek -5", desc = "在预览中向上移动 5 个单位" },
  { on = "J", run = "seek 5", desc = "在预览中向下移动 5 个单位" },

  # Spotting
  { on = "<Tab>", run = "spot", desc = "聚焦悬停文件" },

  # Operation
  { on = "o", run = "open", desc = "打开选中文件" },
  { on = "O", run = "open --interactive", desc = "交互式打开选中文件" },
  { on = "<Enter>", run = "open", desc = "打开选中文件" },
  { on = "<S-Enter>", run = "open --interactive", desc = "交互式打开选中文件" },
  { on = "y", run = "yank", desc = "复制选中文件（复制操作）" },
  { on = "x", run = "yank --cut", desc = "复制选中文件（剪切操作）" },
  { on = "p", run = "paste", desc = "粘贴已复制/剪切的文件" },
  { on = "P", run = "paste --force", desc = "粘贴已复制/剪切的文件（目标存在时覆盖）" },
  { on = "-", run = "link", desc = "为已复制/剪切的文件创建绝对路径符号链接" },
  { on = "_", run = "link --relative", desc = "为已复制/剪切的文件创建相对路径符号链接" },
  { on = "<C-->", run = "hardlink", desc = "为已复制/剪切的文件创建硬链接" },
  { on = "Y", run = "unyank", desc = "取消复制/剪切状态" },
  { on = "X", run = "unyank", desc = "取消复制/剪切状态" },
  { on = "d", run = "remove", desc = "将选中文件移至回收站" },
  { on = "D", run = "remove --permanently", desc = "永久删除选中文件" },
  { on = "a", run = "create", desc = "创建文件（以 / 结尾则创建目录）" },
  { on = "A", run = "bulk_create", desc = "批量创建文件" },
  { on = "r", run = "rename --cursor=before_ext", desc = "重命名选中文件" },
  { on = ";", run = "shell --interactive", desc = "运行 shell 命令" },
  { on = ":", run = "shell --block --interactive", desc = "运行 shell 命令（阻塞直到完成）" },
  { on = ".", run = "hidden toggle", desc = "切换隐藏文件的可见性" },
  { on = "s", run = "search --via=fd", desc = "通过 fd 按名称搜索文件" },
  { on = "S", run = "search --via=rg", desc = "通过 ripgrep 按内容搜索文件" },
  { on = "<C-s>", run = "escape --search", desc = "取消正在进行的搜索" },
  { on = "z", run = "plugin fzf", desc = "通过 fzf 跳转到文件/目录" },
  { on = "Z", run = "plugin zoxide", desc = "通过 zoxide 跳转到目录" },

  # Linemode
  { on = ["m", "s"], run = "linemode size", desc = "行模式：大小" },
  { on = ["m", "p"], run = "linemode permissions", desc = "行模式：权限" },
  { on = ["m", "b"], run = "linemode btime", desc = "行模式：创建时间" },
  { on = ["m", "m"], run = "linemode mtime", desc = "行模式：修改时间" },
  { on = ["m", "o"], run = "linemode owner", desc = "行模式：所有者" },
  { on = ["m", "n"], run = "linemode none", desc = "行模式：无" },

  # Copy
  { on = ["c", "c"], run = "copy path", desc = "复制文件路径" },
  { on = ["c", "C"], run = "copy url", desc = "复制文件 URL" },
  { on = ["c", "d"], run = "copy dirpath", desc = "复制目录路径" },
  { on = ["c", "D"], run = "copy dirurl", desc = "复制目录 URL" },
  { on = ["c", "f"], run = "copy filename", desc = "复制文件名" },
  { on = ["c", "n"], run = "copy name_without_ext", desc = "复制不含扩展名的文件名" },

  # Filter
  { on = "f", run = "filter --smart", desc = "过滤文件" },

  # Find
  { on = "/", run = "find --smart", desc = "查找下一个文件" },
  { on = "?", run = "find --previous --smart", desc = "查找上一个文件" },
  { on = "n", run = "find_arrow", desc = "下一个匹配" },
  { on = "N", run = "find_arrow --previous", desc = "上一个匹配" },

  # Sorting
  { on = [",", "m"], run = ["sort mtime --reverse=no", "linemode mtime"], desc = "按修改时间排序" },
  { on = [",", "M"], run = ["sort mtime --reverse=yes", "linemode mtime"], desc = "按修改时间排序（反向）" },
  { on = [",", "b"], run = ["sort btime --reverse=no", "linemode btime"], desc = "按创建时间排序" },
  { on = [",", "B"], run = ["sort btime --reverse=yes", "linemode btime"], desc = "按创建时间排序（反向）" },
  { on = [",", "e"], run = "sort extension --reverse=no", desc = "按扩展名排序" },
  { on = [",", "E"], run = "sort extension --reverse=yes", desc = "按扩展名排序（反向）" },
  { on = [",", "a"], run = "sort alphabetical --reverse=no", desc = "按字母顺序排序" },
  { on = [",", "A"], run = "sort alphabetical --reverse=yes", desc = "按字母顺序排序（反向）" },
  { on = [",", "n"], run = "sort natural --reverse=no", desc = "按自然顺序排序" },
  { on = [",", "N"], run = "sort natural --reverse=yes", desc = "按自然顺序排序（反向）" },
  { on = [",", "s"], run = ["sort size --reverse=no", "linemode size"], desc = "按大小排序" },
  { on = [",", "S"], run = ["sort size --reverse=yes", "linemode size"], desc = "按大小排序（反向）" },
  { on = [",", "r"], run = "sort random --reverse=no", desc = "随机排序" },

  # Goto
  { on = ["g", "h"], run = "cd ~", desc = "前往 ~/" },
  { on = ["g", "a"], run = "cd ~/Desktop", desc = "前往 ~/Desktop" },
  { on = ["g", "c"], run = "cd ~/.config", desc = "前往 ~/.config" },
  { on = ["g", "l"], run = "cd ~/.local", desc = "前往 ~/.local" },
  { on = ["g", "d"], run = "cd ~/Downloads", desc = "前往 ~/Downloads" },
  { on = ["g", "p"], run = "cd ~/Pictures", desc = "前往 ~/Pictures" },
  { on = ["g", "v"], run = "cd ~/Videos", desc = "前往 ~/Videos" },
  { on = ["g", "m"], run = "cd ~/Music", desc = "前往 ~/Music" },
  { on = ["g", "w"], run = "cd ~/Documents", desc = "前往 ~/Documents" },
  { on = ["g", "u"], run = "cd ~/Public", desc = "前往 ~/Public" },
  { on = ["g", "t"], run = "plugin trash", desc = "前往回收站" },
  { on = ["g", "<Space>"], run = "cd --interactive", desc = "交互式跳转" },
  { on = ["g", "f"], run = "follow", desc = "跟随悬停的符号链接" },

  # Tabs
  { on = ["t", "t"], run = "tab_create --current", desc = "在当前工作目录中新建标签页" },
  { on = ["t", "r"], run = "tab_rename --interactive", desc = "重命名当前标签页" },

  { on = "1", run = "tab_switch 0", desc = "切换到第一个标签页" },
  { on = "2", run = "tab_switch 1", desc = "切换到第二个标签页" },
  { on = "3", run = "tab_switch 2", desc = "切换到第三个标签页" },
  { on = "4", run = "tab_switch 3", desc = "切换到第四个标签页" },
  { on = "5", run = "tab_switch 4", desc = "切换到第五个标签页" },
  { on = "6", run = "tab_switch 5", desc = "切换到第六个标签页" },
  { on = "7", run = "tab_switch 6", desc = "切换到第七个标签页" },
  { on = "8", run = "tab_switch 7", desc = "切换到第八个标签页" },
  { on = "9", run = "tab_switch 8", desc = "切换到第九个标签页" },

  { on = "[", run = "tab_switch -1 --relative", desc = "切换到上一个标签页" },
  { on = "]", run = "tab_switch 1 --relative", desc = "切换到下一个标签页" },

  { on = "{", run = "tab_swap -1", desc = "将当前标签页与上一个标签页交换" },
  { on = "}", run = "tab_swap 1", desc = "将当前标签页与下一个标签页交换" },

  # Tasks
  { on = "w", run = "tasks:show", desc = "显示任务管理器" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[tasks]
keymap = [
  { on = "<Esc>", run = "close", desc = "关闭任务管理器" },
  { on = "<C-[>", run = "close", desc = "关闭任务管理器" },
  { on = "<C-c>", run = "close", desc = "关闭任务管理器" },
  { on = "w", run = "close", desc = "关闭任务管理器" },

  { on = "k", run = "arrow prev", desc = "上一个任务" },
  { on = "j", run = "arrow next", desc = "下一个任务" },

  { on = "<Up>", run = "arrow prev", desc = "上一个任务" },
  { on = "<Down>", run = "arrow next", desc = "下一个任务" },

  { on = "<Enter>", run = "inspect", desc = "查看任务详情" },
  { on = "x", run = "cancel", desc = "取消任务" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[spot]
keymap = [
  { on = "<Esc>", run = "close", desc = "关闭聚焦视图" },
  { on = "<C-[>", run = "close", desc = "关闭聚焦视图" },
  { on = "<C-c>", run = "close", desc = "关闭聚焦视图" },
  { on = "<Tab>", run = "close", desc = "关闭聚焦视图" },

  { on = "k", run = "arrow prev", desc = "上一行" },
  { on = "j", run = "arrow next", desc = "下一行" },
  { on = "h", run = "swipe prev", desc = "滑动到上一个文件" },
  { on = "l", run = "swipe next", desc = "滑动到下一个文件" },

  { on = "<Up>", run = "arrow prev", desc = "上一行" },
  { on = "<Down>", run = "arrow next", desc = "下一行" },
  { on = "<Left>", run = "swipe prev", desc = "滑动到上一个文件" },
  { on = "<Right>", run = "swipe next", desc = "滑动到下一个文件" },

  # Copy
  { on = ["c", "c"], run = "copy cell", desc = "复制选中的单元格" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[pick]
keymap = [
  { on = "<Esc>", run = "close", desc = "取消选择" },
  { on = "<C-[>", run = "close", desc = "取消选择" },
  { on = "<C-c>", run = "close", desc = "取消选择" },
  { on = "<Enter>", run = "close --submit", desc = "提交选择" },

  { on = "k", run = "arrow prev", desc = "上一个选项" },
  { on = "j", run = "arrow next", desc = "下一个选项" },

  { on = "<Up>", run = "arrow prev", desc = "上一个选项" },
  { on = "<Down>", run = "arrow next", desc = "下一个选项" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[input]
keymap = [
  { on = "<C-c>", run = "close", desc = "取消输入" },
  { on = "<Enter>", run = "close --submit", desc = "提交输入" },
  { on = "<Esc>", run = "escape", desc = "返回普通模式，或取消输入" },
  { on = "<C-[>", run = "escape", desc = "返回普通模式，或取消输入" },

  # Mode
  { on = "i", run = "insert", desc = "进入插入模式" },
  { on = "I", run = ["move first-char", "insert"], desc = "移动到行首并进入插入模式" },
  { on = "a", run = "insert --append", desc = "进入追加模式" },
  { on = "A", run = ["move eol", "insert --append"], desc = "移动到行尾并进入追加模式" },
  { on = "v", run = "visual", desc = "进入可视模式" },
  { on = "r", run = "replace", desc = "替换单个字符" },

  # Selection
  { on = "V", run = ["move bol", "visual", "move eol"], desc = "从行首选择到行尾" },
  { on = "<C-A>", run = ["move eol", "visual", "move bol"], desc = "从行尾选择到行首" },
  { on = "<C-E>", run = ["move bol", "visual", "move eol"], desc = "从行首选择到行尾" },

  # Character-wise movement
  { on = "h", run = "move -1", desc = "向后移动一个字符" },
  { on = "l", run = "move 1", desc = "向前移动一个字符" },
  { on = "<Left>", run = "move -1", desc = "向后移动一个字符" },
  { on = "<Right>", run = "move 1", desc = "向前移动一个字符" },
  { on = "<C-b>", run = "move -1", desc = "向后移动一个字符" },
  { on = "<C-f>", run = "move 1", desc = "向前移动一个字符" },

  # Word-wise movement
  { on = "b", run = "backward", desc = "向后移动到当前或上一个单词的开头" },
  { on = "B", run = "backward wide", desc = "向后移动到当前或上一个 WORD 的开头" },
  { on = "w", run = "forward", desc = "向前移动到下一个单词的开头" },
  { on = "W", run = "forward wide", desc = "向前移动到下一个 WORD 的开头" },
  { on = "e", run = "forward --end-of-word", desc = "向前移动到当前或下一个单词的末尾" },
  { on = "E", run = "forward wide --end-of-word", desc = "向前移动到当前或下一个 WORD 的末尾" },
  { on = "<A-b>", run = "backward lean", desc = "向后移动到当前或上一个单词的开头（lean 模式）" },
  { on = "<A-f>", run = "forward lean --end-of-word", desc = "向前移动到当前或下一个单词的末尾（lean 模式）" },
  { on = "<C-Left>", run = "backward lean", desc = "向后移动到当前或上一个单词的开头（lean 模式）" },
  { on = "<C-Right>", run = "forward lean --end-of-word", desc = "向前移动到当前或下一个单词的末尾（lean 模式）" },

  # Line-wise movement
  { on = "0", run = "move bol", desc = "移动到行首" },
  { on = "$", run = "move eol", desc = "移动到行尾" },
  { on = "_", run = "move first-char", desc = "移动到第一个非空白字符" },
  { on = "^", run = "move first-char", desc = "移动到第一个非空白字符" },
  { on = "<C-a>", run = "move bol", desc = "移动到行首" },
  { on = "<C-e>", run = "move eol", desc = "移动到行尾" },
  { on = "<Home>", run = "move bol", desc = "移动到行首" },
  { on = "<End>", run = "move eol", desc = "移动到行尾" },

  # Delete
  { on = "<Backspace>", run = "backspace", desc = "删除光标前的字符" },
  { on = "<Delete>", run = "backspace --under", desc = "删除光标下的字符" },
  { on = "<C-h>", run = "backspace", desc = "删除光标前的字符" },
  { on = "<C-d>", run = "backspace --under", desc = "删除光标下的字符" },

  # Kill
  { on = "<C-u>", run = "kill bol", desc = "删除到行首（向后）" },
  { on = "<C-k>", run = "kill eol", desc = "删除到行尾（向前）" },
  { on = "<C-w>", run = "kill backward", desc = "删除到当前单词开头（向后）" },
  { on = "<A-d>", run = "kill forward", desc = "删除到当前单词末尾（向前）" },
  { on = "<C-Backspace>", run = "kill backward", desc = "删除到当前单词开头（向后）" },
  { on = "<C-Delete>", run = "kill forward", desc = "删除到当前单词末尾（向前）" },

  # Cut/Yank/Paste
  { on = "d", run = "delete --cut", desc = "剪切选中字符" },
  { on = "D", run = ["delete --cut", "move eol"], desc = "剪切至行尾" },
  { on = "c", run = "delete --cut --insert", desc = "剪切选中字符并进入插入模式" },
  { on = "C", run = ["delete --cut --insert", "move eol"], desc = "剪切至行尾并进入插入模式" },
  { on = "s", run = ["delete --cut --insert", "move 1"], desc = "剪切当前字符并进入插入模式" },
  { on = "S", run = ["move bol", "delete --cut --insert", "move eol"], desc = "从行首剪切至行尾并进入插入模式" },
  { on = "x", run = ["delete --cut", "move 1 --in-operating"], desc = "剪切当前字符" },
  { on = "y", run = "yank", desc = "复制选中字符" },
  { on = "p", run = "paste", desc = "在光标后粘贴已复制字符" },
  { on = "P", run = "paste --before", desc = "在光标前粘贴已复制字符" },

  # Undo/Redo/Casefy
  { on = "u", run = ["undo", "casefy lower"], desc = "撤销；若在可视模式中则转为小写" },
  { on = "U", run = "casefy upper", desc = "转为大写" },
  { on = "<C-r>", run = "redo", desc = "重做上一次操作" },

  # History
  { on = "k", run = "recall -1", desc = "调出上一条输入" },
  { on = "j", run = "recall 1", desc = "调出下一条输入" },
  { on = "<Up>", run = "recall -1", desc = "调出上一条输入" },
  { on = "<Down>", run = "recall 1", desc = "调出下一条输入" },
  { on = "<C-p>", run = "recall -1", desc = "调出上一条输入" },
  { on = "<C-n>", run = "recall 1", desc = "调出下一条输入" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[confirm]
keymap = [
  { on = "<Esc>", run = "close", desc = "取消确认" },
  { on = "<C-[>", run = "close", desc = "取消确认" },
  { on = "<C-c>", run = "close", desc = "取消确认" },
  { on = "<Enter>", run = "close --submit", desc = "提交确认" },

  { on = "n", run = "close", desc = "取消确认" },
  { on = "y", run = "close --submit", desc = "提交确认" },

  { on = "k", run = "arrow prev", desc = "上一行" },
  { on = "j", run = "arrow next", desc = "下一行" },

  { on = "<Up>", run = "arrow prev", desc = "上一行" },
  { on = "<Down>", run = "arrow next", desc = "下一行" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[cmp]
keymap = [
  { on = "<C-c>", run = "close", desc = "取消补全" },
  { on = "<Tab>", run = "close --submit", desc = "提交补全" },
  { on = "<Enter>", run = ["close --submit", "input:close --submit"], desc = "完成并提交输入" },

  { on = "<A-k>", run = "arrow prev", desc = "上一个补全项" },
  { on = "<A-j>", run = "arrow next", desc = "下一个补全项" },

  { on = "<Up>", run = "arrow prev", desc = "上一个补全项" },
  { on = "<Down>", run = "arrow next", desc = "下一个补全项" },

  { on = "<C-p>", run = "arrow prev", desc = "上一个补全项" },
  { on = "<C-n>", run = "arrow next", desc = "下一个补全项" },

  # Help
  { on = "~", run = "help", desc = "打开帮助" },
  { on = "<F1>", run = "help", desc = "打开帮助" },
]

[help]
keymap = [
  { on = "<Esc>", run = "escape", desc = "进入普通模式，或隐藏帮助菜单" },
  { on = "<C-[>", run = "escape", desc = "进入普通模式，或隐藏帮助菜单" },
  { on = "<C-c>", run = "close", desc = "关闭帮助菜单" },
  { on = "<Enter>", run = "close --submit", desc = "关闭帮助菜单并运行选中的操作" },

  # Navigation
  { on = "<Up>", run = "arrow prev", desc = "上一行" },
  { on = "<Down>", run = "arrow next", desc = "下一行" },

  { on = "<C-p>", run = "arrow prev", desc = "上一行" },
  { on = "<C-n>", run = "arrow next", desc = "下一行" },
]
